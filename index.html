<script>
/* Chọn đại lý: ?dl=ma-dai-ly trên link, hoặc chọn ở màn hình đăng nhập. Mỗi đại lý một file dữ liệu riêng. */
function crmDealerId() {
  const ids = Object.keys(window.CRM_DEALERS || {});
  let q = ''; try { q = new URLSearchParams(location.search).get('dl') || ''; } catch (e) {}
  let saved = ''; try { saved = localStorage.getItem('crm_dl') || ''; } catch (e) {}
  if (q && window.CRM_DEALERS[q] && q !== saved) { try { localStorage.setItem('crm_dl', q); localStorage.removeItem('crm_tk'); } catch (e) {} saved = q; }
  if (saved && window.CRM_DEALERS[saved]) return saved;
  return ids.length === 1 ? ids[0] : '';
}
function crmApi() { const d = crmDealerId(); return d ? window.CRM_DEALERS[d].api : ''; }
/* Thay google.script.run bằng gọi API qua mạng (doPost của Apps Script) */
window.google = { script: { get run() {
  let ok = null, fail = null;
  const p = new Proxy({}, { get(_, k) {
    if (k === 'withSuccessHandler') return f => { ok = f; return p; };
    if (k === 'withFailureHandler') return f => { fail = f; return p; };
    return (...args) => fetch(crmApi(), { method: 'POST', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: k, args }) })
      .then(r => r.json())
      .then(j => { if (j.ok) { if (ok) ok(j.data); } else if (fail) fail({ message: j.error }); })
      .catch(() => { if (fail) fail({ message: 'Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.' }); });
  } });
  return p;
} } };
</script>
<style>
:root{--red:#DC1E37;--ink:#1d1d1f;--sub:#6b6b70;--line:#e6e6ea;--bg:#f5f5f7;--ok:#1a7f37;--warn:#b25e00;--bad:#c8102e;--blue:#0b63c5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{position:sticky;top:0;padding-top:max(10px,env(safe-area-inset-top));z-index:5;background:var(--red);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:none;border:0;color:#fff;font-size:15px;padding:4px 6px}
main{padding:12px 12px 90px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 2px 10px;font-size:11px;white-space:nowrap;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;line-height:1}
nav button.on{color:var(--red);font-weight:600}
nav .add b{background:var(--red);color:#fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-top:-4px}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid var(--line)}
.tap{cursor:pointer}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--sub);font-size:13px}
.badge{font-size:12px;padding:2px 8px;border-radius:20px;white-space:nowrap;font-weight:600}
.s-moi{background:#e7f1fb;color:var(--blue)}.s-dang{background:#fff4e0;color:var(--warn)}.s-chot{background:#e5f4e4;color:var(--ok)}.s-mat{background:#f0efec;color:#555}.s-chua{background:#efedff;color:#5b4bc4}
.tag{font-size:12px;color:var(--bad);font-weight:600}
.flag{font-size:12px;color:#5b4bc4}
ol.lh{list-style:none;margin:8px 0 0;padding:8px 0 0;border-top:1px dashed var(--line)}
ol.lh li{font-size:13px;padding:2px 0;display:flex;gap:8px}
ol.lh li span{color:var(--sub);white-space:nowrap;min-width:78px}
ol.lh li em{font-style:normal;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
h2{font-size:15px;margin:18px 2px 8px;color:var(--sub);text-transform:uppercase;letter-spacing:.3px}
h2 small{text-transform:none;font-weight:400}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid #cfcfd4;border-radius:10px;background:#fff;margin:4px 0 10px}
textarea{min-height:80px;resize:vertical}
label{font-size:13px;color:var(--sub);font-weight:600}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:13px;font:inherit;font-weight:600;background:var(--red);color:#fff}
.btn:disabled{opacity:.5}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #cfcfd4}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.chip{border:1px solid #cfcfd4;background:#fff;border-radius:20px;padding:7px 12px;font-size:14px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.acts{display:flex;gap:8px;margin-top:10px}
.acts a,.acts button{flex:1;text-align:center;text-decoration:none;border-radius:10px;padding:10px;font-weight:600;font-size:14px;border:1px solid #cfcfd4;background:#fff;color:var(--ink)}
.acts .call{background:var(--ok);color:#fff;border-color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--sub)}
.stat.tap:active{background:#f0f0f3}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.bar i{display:block;height:8px;background:var(--red);border-radius:4px}
.bar .l{width:42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .v{width:34px;text-align:right;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:12px}
.tl .it{position:relative;padding:0 0 14px}
.tl .it:before{content:"";position:absolute;left:-18px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.empty{text-align:center;color:var(--sub);padding:24px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .box{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px 24px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;display:none;max-width:90%}
.toast.err{background:var(--bad)}
.load{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:25;display:none;align-items:center;justify-content:center}
.load.on{display:flex}
.spin{width:36px;height:36px;border:4px solid #ddd;border-top-color:var(--red);border-radius:50%;animation:s 0.8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.login{min-height:100vh;min-height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;max-width:400px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 28px max(18px,env(safe-area-inset-bottom))}
body:has(.login){background:#fff}
.login .logo{display:block;height:16px;width:auto;color:var(--red)}
.lg-mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 0 24px}
.login .app{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--sub);margin:0 0 10px}
.login h2{text-transform:none;font-size:28px;font-weight:600;letter-spacing:-.4px;color:var(--ink);margin:0 0 6px}
.login .sub{margin:0 0 22px;font-size:14px}
.login input{margin:0 0 12px;padding:13px 14px;border-color:var(--line);background:#fafafa}
.login input:focus{outline:none;border-color:var(--ink);background:#fff}
.login .install{border:1px solid var(--line);background:#fafafa;font-size:13px;margin:16px 0 0}
.login .credit{margin:0;font-size:11px;line-height:1.7}
header .logo{height:15px;width:auto;flex:none;color:#fff}
header .sep{width:1px;height:18px;background:rgba(255,255,255,.5);flex:none}
.credit{text-align:center;font-size:12px;color:var(--sub);margin:24px 0 4px;line-height:1.6}
.credit a{color:var(--red);font-weight:600;text-decoration:none}
.seg{display:flex;background:#e9e9ee;border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font:inherit;font-size:14px}
.seg button.on{background:#fff;font-weight:600}
.hide{display:none!important}
.install{background:#fff;border:1px dashed var(--red);border-radius:12px;padding:12px;margin:12px 0;font-size:14px}
.install b{color:var(--red)}
.rk{display:flex;align-items:center;gap:10px}
.rk .no{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:#1C2F40;flex:none}
.rk .no.r1{background:#DC1E37}.rk .no.r2{background:#6D98BF}.rk .no.r3{background:#B5A579}
.rk .sc{font-size:26px;font-weight:700;color:var(--red);text-align:right;line-height:1}
.rk .sc small{display:block;font-size:11px;color:var(--sub);font-weight:400}
.mx{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.mx div{background:var(--bg);border-radius:8px;padding:6px 8px}
.mx b{display:block;font-size:17px}.mx span{font-size:11px;color:var(--sub)}
.sbar{height:6px;background:#eee;border-radius:3px;margin-top:8px;overflow:hidden}.sbar i{display:block;height:6px;background:var(--red)}
</style>
</head>

const $ = s => document.querySelector(s);
const app = $('#app');
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function toast(m, err) { const t = $('#toast'); t.textContent = m; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', err ? 4500 : 2500); }
let loading = 0;
function busy(on) { loading += on ? 1 : -1; $('#load').classList.toggle('on', loading > 0); }
function api(fn, ...args) {
  busy(true);
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(r => { busy(false); res(r); })
      .withFailureHandler(e => { busy(false); const m = (e && e.message) || String(e); if (/hết hạn/.test(m)) { doLogout(true); } toast(m, true); rej(e); })[fn](...args);
  });
}
function isMgr() { return S.user && (S.user.role === 'Admin' || S.user.role === 'Chủ đại lý'); }

const CREDIT = '<div class="credit">Hotline hỗ trợ: <a href="tel:0938511355">0938.511.355</a><br>(c) Copyright by Viet_Yanmar Vietnam</div>';
function header(title, back) {
  return '<header>' + (back ? '<button onclick="' + back + '">&larr;</button>' : LOGO + '<span class="sep"></span>') + '<h1>' + esc(title) + '</h1>' +
    (back ? '' : '<button onclick="doLogout()">Thoát</button>') + '</header>';

/* ---------- Đăng nhập ---------- */
function showLogin() {
  $('#nav').classList.add('hide');
  app.innerHTML = '<div class="login"><div>' + LOGO + '</div><div class="lg-mid"><p class="app">CRM chăm sóc khách hàng</p><h2>Đăng nhập</h2><p class="sub">Nhập passcode được đại lý cấp</p>' + dealerPick() +

function fileLink(f) {

function formContact() {
  const c = S.cur, cfg = S.cfg;
  const st0 = c.status === 'Chưa phân loại' || c.status === 'Mới' ? 'Đang chăm sóc' : c.status;
  openSheet('<div class="row"><b class="grow" style="font-size:17px">Cập nhật: ' + esc(c.name) + '</b><button class="btn sm ghost" onclick="closeSheet()">Đóng</button></div>' +

    '<label>Trạng thái</label>' + chips('status', ['Đang chăm sóc', 'Đã chốt', 'Mất'], st0) +
    '<div id="lostBox" class="' + (st0 === 'Mất' ? '' : 'hide') + '"><label>Lý do mất</label>' + chips('lost', cfg.lost, '') + '</div>' +
    '<label>Ghi chú</label><textarea id="fn" placeholder="Khách nói gì, cần gì..."></textarea>' +
    '<div id="apptBox" class="' + (st0 === 'Đang chăm sóc' ? '' : 'hide') + '"><label>Hẹn gọi lại</label>' +
    chips('quick', ['Ngày mai', '3 ngày', '1 tuần', '2 tuần', '1 tháng'], '') +
    '<input id="fa" type="date" min="' + iso(new Date()) + '" value="' + esc(c.overdue ? '' : c.apptIso) + '"></div>' +
    '<details><summary class="sub" style="margin-bottom:8px">Model, đánh giá</summary>' +
    '<label>Model quan tâm</label><input id="fm" list="models" value="' + esc(c.model) + '"><datalist id="models">' + cfg.models.map(m => '<option value="' + esc(m) + '">').join('') + '</datalist>' +
    '<label>Đánh giá</label>' + chips('rating', ['Thấp', 'Trung bình', 'Cao'], c.rating) + '</details>' +
    '<button class="btn" id="fsave">Lưu</button>');
  const box = $('#sheetBox');
  box.addEventListener('pick', e => {
    const { name, val } = e.detail;
    if (name === 'status') { $('#lostBox').classList.toggle('hide', val !== 'Mất'); $('#apptBox').classList.toggle('hide', val !== 'Đang chăm sóc'); }
    if (name === 'quick') $('#fa').value = addDays({ 'Ngày mai': 1, '3 ngày': 3, '1 tuần': 7, '2 tuần': 14, '1 tháng': 30 }[val]);
  });
  $('#fsave').onclick = () => {
    const p = { phone: c.phone, form: chipVal(box, 'form'), status: chipVal(box, 'status'), lost: chipVal(box, 'lost'), note: $('#fn').value, appt: $('#fa').value, model: $('#fm').value, rating: chipVal(box, 'rating') };
    if (p.status === 'Mất' && !p.lost) return toast('Chọn lý do mất khách', true);
    if (p.status === 'Đang chăm sóc' && !p.appt && !confirm('Chưa đặt ngày hẹn gọi lại. Vẫn lưu?')) return;
    $('#fsave').disabled = true;
    api('saveContact', S.token, p).then(() => { closeSheet(); toast('Đã lưu'); openCust(c.phone); }).catch(() => { $('#fsave').disabled = false; });
  };
}

        '<span class="badge ' + KIND[x.kind][1] + '">' + esc(x.kind === 'đã có - người khác' ? 'đã có' : x.kind) + '</span></div></div>').join(''));
    if ($('#eimp')) $('#eimp').onclick = () => {
      $('#eimp').disabled = true;
      api('importEvent', S.token, { code: e.code, owner: $('#eo') ? $('#eo').value : '' }).then(x => { closeSheet(); toast('Đã nhập: ' + x.fresh + ' khách mới, ' + x.old + ' khách cũ'); loadEvents(); }).catch(() => { $('#eimp').disabled = false; });
    };
  }).catch(() => {});
}

/* ---------- Nhiệm vụ ---------- */
function taskCard(t) {
  return '<div class="card"><div class="row"><div class="grow"><div class="name">' + esc(t.name) + '</div><div class="sub">' + esc(t.phone) + (t.xa ? ' · ' + esc(t.xa) : '') + (t.model ? ' · ' + esc(t.model) : '') + '</div></div>' +
    (t.done ? '<span class="badge s-chot">Xong</span>' : t.overdue ? '<span class="badge s-mat" style="color:var(--bad)">Quá hạn</span>' : '') + '</div>' +
    '<div class="sub">Hạn: ' + esc(t.deadline || '–') + ' · Giao cho ' + esc(t.to) + ' · Người giao ' + esc(t.by) + '</div>' +
    (t.note ? '<div style="margin-top:4px;white-space:pre-line">' + esc(t.note) + '</div>' : '') +
    (t.done ? '' : '<div class="acts"><a class="call" href="tel:' + esc(t.phone) + '">Gọi</a><button onclick="openCust(\'' + esc(t.phone) + '\')">Hồ sơ</button><button onclick="doneTask(\'' + esc(t.id) + '\')">Xong</button></div>') + '</div>';
}
function vTask() {
  app.innerHTML = header('Nhiệm vụ') + '<main>' +
    (isMgr() ? '<div class="seg"><button id="tMine" class="on">Việc của tôi</button><button id="tAll">Tất cả</button></div>' +
      '<details class="card"><summary><b>+ Giao nhiệm vụ mới</b></summary><div style="margin-top:10px">' +
      '<label>Số điện thoại *</label><input id="tp" type="tel" inputmode="numeric"><label>Tên khách *</label><input id="tn">' +
      '<label>Giao cho *</label><select id="tto"><option value="">– Chọn –</option>' + S.cfg.staff.map(s => '<option>' + esc(s) + '</option>').join('') + '</select>' +
      '<label>Thời hạn *</label><input id="td" type="date" min="' + iso(new Date()) + '">' +
      '<label>Model</label><input id="tm" list="models3"><datalist id="models3">' + S.cfg.models.map(m => '<option value="' + esc(m) + '">').join('') + '</datalist>' +
      '<label>Việc cần làm</label><textarea id="tnote"></textarea><button class="btn" id="tsave">Giao nhiệm vụ</button></div></details>' : '') +
    '<div id="tl"></div></main>';
  const load = mine => api('listTasks', S.token, mine).then(ts => {
    const open = ts.filter(t => !t.done), done = ts.filter(t => t.done);
    $('#tl').innerHTML = '<h2>Đang làm <small>(' + open.length + ')</small></h2>' + (open.length ? open.map(taskCard).join('') : '<div class="empty">Không có nhiệm vụ</div>') +
      (done.length ? '<h2>Đã xong <small>(' + done.length + ')</small></h2>' + done.slice(0, 20).map(taskCard).join('') : '');
  }).catch(() => {});
  if (isMgr()) {
    $('#tMine').onclick = () => { $('#tMine').classList.add('on'); $('#tAll').classList.remove('on'); load(true); };
    $('#tAll').onclick = () => { $('#tAll').classList.add('on'); $('#tMine').classList.remove('on'); load(false); };
    $('#tsave').onclick = () => {
      const p = { phone: $('#tp').value, name: $('#tn').value, to: $('#tto').value, deadline: $('#td').value, model: $('#tm').value, note: $('#tnote').value };
      $('#tsave').disabled = true;
      api('createTask', S.token, p).then(r => { toast(r && r.created ? 'Đã giao nhiệm vụ và tạo khách mới' : 'Đã giao nhiệm vụ'); vTask(); }).catch(() => { $('#tsave').disabled = false; });
    };
  }
  load(true);
}
function doneTask(id) {
  const note = prompt('Kết quả (có thể bỏ trống):', '');
  if (note === null) return;
  api('completeTask', S.token, id, note).then(() => { toast('Đã đánh dấu xong'); go(S.view); }).catch(() => {});
}

/* ---------- Báo cáo ---------- */
function vReport() {
  const m = S.rm || iso(new Date()).slice(0, 7);
  app.innerHTML = header('Báo cáo') + '<main><input id="rm" type="month" value="' + m + '"><div id="rb"></div></main>';
  let rt; $('#rm').onchange = () => { clearTimeout(rt); rt = setTimeout(() => { if ($('#rm').value) { S.rm = $('#rm').value; vReport(); } }, 900); };
  api('getReport', S.token, m).then(r => {
    const bars = arr => { const mx = Math.max(1, ...arr.map(x => x[1])); return arr.length ? arr.map(x => '<div class="bar"><span class="l">' + esc(x[0]) + '</span><span class="grow"><i style="width:' + Math.round(100 * x[1] / mx) + '%"></i></span><span class="v">' + x[1] + '</span></div>').join('') : '<div class="sub">Chưa có số liệu</div>'; };
    const pm = 'T' + (+r.prevMonth.slice(5)) + '/' + r.prevMonth.slice(0, 4);
    $('#rb').innerHTML = '<div class="sub">Phạm vi: ' + esc(r.scope) + ' · so sánh với tháng trước (' + pm + ')</div>' +
      (r.me ? meHtml(r.me) : '') +
      '<h2>' + (r.me ? 'Khách hàng của tôi' : 'Toàn đại lý') + '</h2><div class="stats">' +
        kpi('Tổng khách đang có', r.now.total, r.prev.total) + kpi('Khách mới', r.now.newLeads, r.prev.newLeads) + kpi('Khách chăm sóc', r.now.caring, r.prev.caring) +
        kpi('Đã chốt', r.now.won, r.prev.won) + kpi('Mất', r.now.lost, r.prev.lost, true) + kpi('Lần tương tác', r.now.contacts, r.prev.contacts) +
      '</div><div class="sub" style="margin-top:6px">Tỷ lệ chốt tháng này: <b>' + (r.winRate == null ? '–' : r.winRate + '%') + '</b> · Khách được liên hệ: <b>' + r.customers + '</b></div>' +
      (r.board ? boardHtml(r.board) : '') +
      '<h2>Khách mới theo nguồn</h2><div class="card">' + bars(r.bySource) + '</div>' +
      '<h2>Lý do mất khách</h2><div class="card">' + bars(r.byLost) + '</div>' +
      '<h2>Trạng thái khách hiện tại</h2><div class="card">' + bars(r.byStatus) + '</div>' +
      '';
  }).catch(() => {});
}

/* ---------- Kết quả cá nhân ---------- */
function kpi(label, v, p, lowerIsBetter) {
  const d = v - p;
  const good = lowerIsBetter ? d < 0 : d > 0, bad = lowerIsBetter ? d > 0 : d < 0;
  const col = good ? 'var(--ok)' : bad ? 'var(--bad)' : 'var(--sub)';
  const txt = d === 0 ? '= tháng trước' : (d > 0 ? '▲ +' : '▼ ') + d + ' so với tháng trước';
  return '<div class="stat"><b>' + v + '</b><span>' + label + '</span><div style="font-size:11px;font-weight:600;color:' + col + ';margin-top:2px">' + txt + '</div></div>';
}
function meHtml(me) {
  const names = { won: 'Khách đã chốt', newLeads: 'Khách mới', contacts: 'Lần liên hệ', newCare: 'Chăm khách mới', winRate: 'Tỷ lệ chốt', onTime: 'Gọi đúng hẹn' };
  const ds = me.prevScore == null ? '' : (me.score - me.prevScore === 0 ? 'bằng tháng trước' : (me.score > me.prevScore ? '▲ +' : '▼ ') + (me.score - me.prevScore) + ' điểm so với tháng trước');
  return '<div class="card" style="margin-top:10px"><div class="rk"><div class="no r' + me.rank + '">' + me.rank + '</div>' +
    '<div class="grow"><div class="name">Hạng ' + me.rank + '/' + me.of + ' trong đại lý</div><div class="sub">' + ds + (me.prevRank ? ' · tháng trước hạng ' + me.prevRank : '') + '</div></div>' +
    '<div class="sc">' + me.score + '<small>/100 điểm</small></div></div>' +
    '<div style="margin-top:10px">' + Object.keys(names).map(k => {
      const got = me.parts[k], max = me.weights[k];
      return '<div class="bar"><span class="l">' + names[k] + '</span><span class="grow"><i style="width:' + Math.round(100 * got / max) + '%"></i></span><span class="v" style="width:60px">' + Math.round(got) + '/' + max + '</span></div>';
    }).join('') + '</div>' +
    '<div class="sub" style="margin-top:6px">Thanh nào ngắn là chỗ cần cố thêm. Đang quá hẹn: <b>' + me.overdue + '</b> khách.</div></div>';
}

/* ---------- Bảng thi đua ---------- */
function pct(v) { return v == null ? '–' : v + '%'; }
function boardHtml(bd) {
  const w = bd.weights;
  const rows = bd.list.map(b => '<div class="card"><div class="rk"><div class="no r' + b.rank + '">' + b.rank + '</div>' +
    '<div class="grow"><div class="name">' + esc(b.name) + '</div><div class="sub">Phụ trách ' + b.total + ' khách · đang chăm sóc ' + b.caring + '</div></div>' +
    '<div class="sc">' + b.score + '<small>/100 điểm</small></div></div>' +
    '<div class="sbar"><i style="width:' + b.score + '%"></i></div>' +
    '<div class="mx">' +
      '<div><b>' + b.won + '</b><span>Đã chốt</span></div><div><b>' + b.lost + '</b><span>Mất</span></div><div><b>' + pct(b.winRate) + '</b><span>Tỷ lệ chốt</span></div>' +
      '<div><b>' + b.newLeads + '</b><span>Khách mới</span></div><div><b>' + pct(b.newCareRate) + '</b><span>Chăm khách mới</span></div><div><b>' + b.contacts + '</b><span>Lần liên hệ</span></div>' +
      '<div><b>' + b.customers + '</b><span>Khách được LH</span></div><div><b>' + b.overdue + '</b><span>Quá hẹn</span></div><div><b>' + pct(b.onTimeRate) + '</b><span>Đúng hẹn</span></div>' +
    '</div></div>').join('');
  return '<h2>Bảng thi đua nhân viên</h2>' + (bd.list.length ? rows : '<div class="empty">Chưa có nhân viên</div>') +
    '<details class="card"><summary><b>Cách tính điểm (100 điểm)</b></summary><div style="margin-top:8px">' +
    '<table><tr><th>Tiêu chí</th><th>Điểm</th></tr>' +
    '<tr><td>Số khách đã chốt (so với người cao nhất)</td><td>' + w.won + '</td></tr>' +
    '<tr><td>Số khách mới (so với người cao nhất)</td><td>' + w.newLeads + '</td></tr>' +
    '<tr><td>Số lần liên hệ, tối đa ' + bd.cap + ' lần/ngày (so với người cao nhất)</td><td>' + w.contacts + '</td></tr>' +
    '<tr><td>Tỷ lệ chăm khách mới (khách mới đã được cập nhật lại)</td><td>' + w.newCare + '</td></tr>' +
    '<tr><td>Tỷ lệ chốt = Chốt / (Chốt + Mất)</td><td>' + w.winRate + '</td></tr>' +
    '<tr><td>Tỷ lệ đúng hẹn (khách có hẹn mà chưa quá hẹn)</td><td>' + w.onTime + '</td></tr></table>' +
    '<div class="sub" style="margin-top:8px">Chỉ xếp hạng tài khoản vai trò Nhân viên. Số liệu theo tháng đang chọn, riêng Phụ trách, Đang chăm sóc, Quá hẹn, Đúng hẹn là số hiện tại.</div></div></details>';
}

/* Chân trang hotline + bản quyền ở cuối mỗi trang */
new MutationObserver(() => { const m = app.querySelector('main'); if (!m) return; const c = m.querySelector(':scope > .credit'); if (!c) m.insertAdjacentHTML('beforeend', CREDIT); else if (c !== m.lastElementChild) m.appendChild(c); })
  .observe(app, { childList: true, subtree: true });

/* ---------- Cài app lên màn hình chính ---------- */
let deferredPrompt = null;
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; showInstall(); });
function installHtml() {
  if (isStandalone()) return '';
  if (isIOS()) return '<div class="install"><b>Cài app lên iPhone:</b> bấm nút <b>Chia sẻ</b> (ô vuông có mũi tên lên) ở thanh dưới Safari, chọn <b>Thêm vào MH chính</b>, rồi bấm <b>Thêm</b>.</div>';
  if (deferredPrompt) return '<div class="install"><b>Cài app lên điện thoại</b> để mở nhanh như ứng dụng thật.<button class="btn" style="margin-top:8px" onclick="doInstall()">Cài đặt Yanmar CRM</button></div>';
  return '<div class="install"><b>Cài app lên Android:</b> bấm <b>⋮</b> góc trên Chrome, chọn <b>Cài đặt ứng dụng</b> hoặc <b>Thêm vào màn hình chính</b>.</div>';
}
function showInstall() { const el = document.getElementById('installBox'); if (el) el.innerHTML = installHtml(); }
function doInstall() { if (!deferredPrompt) return; deferredPrompt.prompt(); deferredPrompt.userChoice.finally(() => { deferredPrompt = null; showInstall(); }); }
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

function dealerPick() {
  const all = window.CRM_DEALERS || {}, ids = Object.keys(all), cur = crmDealerId();
  if (ids.length <= 1) return cur ? '<p class="sub">Đại lý: <b>' + esc(all[cur].name) + '</b></p>' : '';
  return '<label>Đại lý của bạn</label><select id="dlSel" onchange="pickDealer(this.value)"><option value="">– Chọn đại lý –</option>' +
    ids.map(i => '<option value="' + i + '"' + (i === cur ? ' selected' : '') + '>' + esc(all[i].name) + '</option>').join('') + '</select>';
}
function pickDealer(v) { try { localStorage.setItem('crm_dl', v); localStorage.removeItem('crm_tk'); } catch (e) {} }
/* ---------- Khởi động ---------- */
(function init() {
  const tk = store('crm_tk');
  if (!tk) return showLogin();
  S.token = tk;
  google.script.run.withSuccessHandler(r => { S.user = r.user; S.cfg = r.cfg; start(); })
    .withFailureHandler(() => { store('crm_tk', null); showLogin(); }).me(tk);
})();
</script>
</body>
</html>
