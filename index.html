<script>
/* Chọn đại lý: ?dl=ma-dai-ly trên link, hoặc chọn ở màn hình đăng nhập. Mỗi đại lý một file dữ liệu riêng. */
function crmDealerId() {
  const ids = Object.keys(window.CRM_DEALERS || {});
  let q = ''; try { q = new URLSearchParams(location.search).get('dl') || ''; } catch (e) {}
  let saved = ''; try { saved = localStorage.getItem('crm_dl') || ''; } catch (e) {}
  if (q && window.CRM_DEALERS[q] && q !== saved) { try { localStorage.setItem('crm_dl', q); localStorage.removeItem('crm_tk'); } catch (e) {} saved = q; }
  if (saved && window.CRM_DEALERS[saved]) return saved;
  return ids.length === 1 ? ids[0] : '';
}
function crmApi() { const d = crmDealerId(); return d ? window.CRM_DEALERS[d].api : ''; }
/* Thay google.script.run bằng gọi API qua mạng (doPost của Apps Script) */
window.google = { script: { get run() {
  let ok = null, fail = null;
  const p = new Proxy({}, { get(_, k) {
    if (k === 'withSuccessHandler') return f => { ok = f; return p; };
    if (k === 'withFailureHandler') return f => { fail = f; return p; };
    return (...args) => fetch(crmApi(), { method: 'POST', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: k, args }) })
      .then(r => r.json())
      .then(j => { if (j.ok) { if (ok) ok(j.data); } else if (fail) fail({ message: j.error }); })
      .catch(() => { if (fail) fail({ message: 'Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.' }); });
  } });
  return p;
} } };
</script>
<style>

.install{background:#fff;border:1px dashed var(--red);border-radius:12px;padding:12px;margin:12px 0;font-size:14px}

.sbar{height:6px;background:#eee;border-radius:3px;margin-top:8px;overflow:hidden}.sbar i{display:block;height:6px;background:var(--red)}
</style>

<body>
<div id="app"></div>
<nav id="nav" class="hide">
  <button data-v="today"><b>&#9737;</b>Hôm nay</button>
  <button data-v="cust"><b>&#9776;</b>Khách hàng</button>
  <button data-v="add" class="add"><b>+</b>Thêm khách</button>
  <button data-v="task"><b>&#10003;</b>Nhiệm vụ</button>
  <button data-v="report"><b>&#9636;</b>Báo cáo</button>
</nav>
<div id="sheet" class="sheet"><div class="box" id="sheetBox"></div></div>
<div id="toast" class="toast"></div>
<div id="load" class="load"><div class="spin"></div></div>

<script>
/* ---------- Nền tảng ---------- */
const S = { token: null, user: null, cfg: null, view: 'today', q: { text: '', status: '', owner: '', special: '', page: 0 }, list: [], total: 0, cur: null };
const $ = s => document.querySelector(s);
const app = $('#app');
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function toast(m, err) { const t = $('#toast'); t.textContent = m; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', err ? 4500 : 2500); }
let loading = 0;
function busy(on) { loading += on ? 1 : -1; $('#load').classList.toggle('on', loading > 0); }
/* Gọi máy chủ không báo lỗi (dùng cho phần phụ, ví dụ biểu đồ dự kiến) */
function apiQuiet(fn, ...args) {
  return new Promise((res, rej) => { google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args); });
}
function api(fn, ...args) {
  busy(true);
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(r => { busy(false); res(r); })
      .withFailureHandler(e => { busy(false); const m = (e && e.message) || String(e); if (/hết hạn/.test(m)) { doLogout(true); } toast(m, true); rej(e); })[fn](...args);
  });
}
function devId() { let d = store('crm_dev'); if (!d) { d = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); store('crm_dev', d); } return d || 'khong-ro'; }
function isMgr() { return S.user && (S.user.role === 'Admin' || S.user.role === 'Chủ đại lý'); }
function stCls(s) { return s === 'Mới' ? 's-moi' : s === 'Đang chăm sóc' ? 's-dang' : s === 'Đã chốt' ? 's-chot' : s === 'Mất' ? 's-mat' : 's-chua'; }
function iso(d) { const z = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
function addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); }
const RT = ['Cao', 'Trung bình', 'Thấp'];
function rtIdx(r) { const i = RT.indexOf(r); return i < 0 ? 3 : i; }
function careText(c) {
  if (!c.careDue) return '';
  return c.days == null ? 'Chưa có lần liên hệ nào' : c.days + ' ngày chưa liên hệ (' + (c.rating || '') + ': ' + (S.cfg.ratingDays || {})[c.rating] + ' ngày/lần)';
}
function modelSelect(id, val) {
  const list = S.cfg.models || [], has = !val || list.indexOf(val) >= 0, nw = (S.cfg.succ || {})[val];
  return '<select id="' + id + '"><option value="">– Chọn model –</option>' + list.map(m => '<option' + (m === val ? ' selected' : '') + '>' + esc(m) + '</option>').join('') +
    (has ? '' : nw ? '<option value="' + esc(val) + '" selected>' + esc(val) + ' (ngừng bán, nay là ' + esc(nw) + ')</option>' : '<option value="" selected>' + esc(val) + ' (không chuẩn, chọn lại)</option>') + '</select>';
}
/* ---------- Ảnh khách ---------- */
function initials(n) { const w = String(n || '').trim().split(/\s+/).filter(Boolean); return esc(((w[w.length - 1] || '?')[0] || '?').toUpperCase()); }
function avatar(c, px) {
  const st = 'width:' + px + 'px;height:' + px + 'px;font-size:' + Math.round(px * 0.42) + 'px';
  return c.thumb ? '<img class="av" style="' + st + '" src="' + esc(c.thumb) + '" alt="">' : '<span class="av" style="' + st + '">' + initials(c.name) + '</span>';
}
/** Thu nhỏ ảnh trên điện thoại: ảnh lưu (cạnh dài 1280px) và ảnh nhỏ (96px) */
function shrink(file, max, q) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight; const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', q).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Không đọc được ảnh')); };
    img.src = url;
  });
}
function thumbSquare(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.naturalWidth, img.naturalHeight), cv = document.createElement('canvas'); cv.width = cv.height = 96;
      cv.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, 96, 96);
      URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', 0.7).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Không đọc được ảnh')); };
    img.src = url;
  });
}
function uploadPhoto(phone, file) {
  if (!file) return Promise.resolve(null);
  toast('Đang tải ảnh lên…');
  return Promise.all([shrink(file, 1280, 0.82), thumbSquare(file)]).then(([full, th]) => api('savePhoto', S.token, phone, full, th))
    .then(r => { toast('Đã lưu ảnh: ' + r.name); return r; });
}
function photoInput(id) {
  return '<label>Ảnh khách (không bắt buộc)</label><input id="' + id + '" type="file" accept="image/*" style="padding:8px">' +
    '<div class="sub" style="margin:-4px 0 8px;font-size:12px">Chụp chân dung hoặc ảnh khách bên máy để dễ nhận ra. Nên hỏi khách trước khi chụp.</div>';
}
function pickPhoto() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => { const f = inp.files[0]; if (f) uploadPhoto(S.cur.phone, f).then(() => openCust(S.cur.phone)).catch(() => {}); };
  inp.click();
}
function viewPhoto() {
  api('getPhoto', S.token, S.cur.phone).then(u => {
    if (!u) return toast('Khách chưa có ảnh', true);
    openSheet('<div class="row"><b class="grow">' + esc(S.cur.name) + '</b><button class="btn sm ghost" onclick="closeSheet()">Đóng</button></div><img class="pv" src="' + u + '" alt="">' +
      '<button class="btn ghost" onclick="closeSheet();pickPhoto()">Đổi ảnh</button>');
  }).catch(() => {});
}
function modelTxt(c) { return c.model ? c.model + (c.modelNow && c.modelNow !== c.model ? ' → ' + c.modelNow : '') : ''; }
function chips(name, opts, val) { return '<div class="chips" data-name="' + name + '">' + opts.map(o => '<button type="button" class="chip' + (o === val ? ' on' : '') + '" data-val="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>'; }
function chipVal(root, name) { const b = root.querySelector('.chips[data-name="' + name + '"] .chip.on'); return b ? b.dataset.val : ''; }
document.addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  const g = c.parentNode; if (g.dataset.multi) c.classList.toggle('on'); else { g.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); c.classList.add('on'); }

function fcHtml(f) {
  const mm = f.month.slice(5) + '/' + f.month.slice(0, 4);

  h += '<h2>Bán hàng tháng ' + mm + ' <small>(' + (isMgr() ? 'toàn đại lý' : 'của tôi') + (f.daysLeft ? ', còn ' + f.daysLeft + ' ngày' : '') + ')</small></h2><div class="card">';
  h += cats.filter(c => c !== 'Khác').map(c => {
    const b = f.rows[c], t = b.target, done = b.won, fc = b.forecast;
    const W = v => t ? Math.min(100, v / t * 100) : 0;
    const pct = t ? Math.round((done + fc) / t * 100) : null, pd = t ? Math.round(done / t * 100) : null;
    return '<div style="margin-bottom:10px"><div class="row2"><b>' + c + '</b><span class="sub">' +
      (t ? 'Chốt ' + done + '/' + t + ' (' + pd + '%) · dự kiến <b style="color:' + (pct >= 100 ? 'var(--ok)' : pct >= 70 ? 'var(--warn)' : 'var(--bad)') + '">' + pct + '%</b>' : 'Chốt ' + done + ' · chưa có chỉ tiêu') + '</span></div>' +
      '<div class="bar"><i style="left:0;width:' + W(done) + '%;background:#2F855A"></i><i style="left:' + W(done) + '%;width:' + Math.max(0, Math.min(W(fc), 100 - W(done))) + '%;background:#9AD0A8"></i></div>' +

  const mx = Math.max(1, ...cats.map(c => { const p = f.rows[c].pot; return p['Cao'] + p['Trung bình'] + p['Thấp'] + p.none; }));
  h += '<b style="font-size:14px">Khách tiềm năng đang chăm sóc</b>' + cats.map(c => {

    const seg = (v, col, rt) => v ? '<span style="width:' + (v / mx * 100) + '%;background:' + col + '" onclick="event.stopPropagation();filterGo({cat:\'' + c + '\',rating:\'' + rt + '\'})">' + v + '</span>' : '';
    return '<div class="row" style="margin-top:6px;gap:8px"><span style="width:66px;font-size:13px">' + c + '</span><div class="pot" onclick="filterGo({cat:\'' + c + '\'})">' +
      seg(p['Cao'], '#DC1E37', 'Cao') + seg(p['Trung bình'], '#D69E2E', 'Trung bình') + seg(p['Thấp'], '#2F855A', 'Thấp') + seg(p.none, '#a0a0a8', 'none') + (tot ? '' : '<span style="color:var(--sub)">0</span>') + '</div></div>';
  }).join('');
  h += '<div class="lg"><span><b style="background:#DC1E37"></b>Cao</span><span><b style="background:#D69E2E"></b>Trung bình</span><span><b style="background:#2F855A"></b>Thấp</span><span><b style="background:#a0a0a8"></b>Chưa đánh giá</span></div>';
  if (f.noModel) h += '<div class="sub" style="font-size:12px">' + f.noModel + ' khách chưa có model, chưa tính vào biểu đồ.</div>';
  if (isMgr()) h += '<div class="row" style="gap:8px;margin-top:8px"><button class="btn sm ghost" onclick="vTargets(\'' + f.month + '\')">Chỉ tiêu tháng này</button><button class="btn sm ghost" onclick="vTargets(\'' + f.next + '\')">Chỉ tiêu tháng ' + f.next.slice(5) + '</button></div>';

  let t; $('#qt').oninput = () => { clearTimeout(t); t = setTimeout(() => { S.q.text = $('#qt').value; loadList(0); }, 400); };
  $('#qs').onchange = () => { S.q.status = $('#qs').value; loadList(0); };
  if ($('#qo')) $('#qo').onchange = () => { S.q.owner = $('#qo').value; loadList(0); };
  $('#qm').onchange = () => { S.q.model = $('#qm').value; loadList(0); };
  $('#more').onclick = () => loadList(S.q.page + 1);
  loadList(0);
}
function loadList(page) {
  S.q.page = page;
  api('listCustomers', S.token, S.q).then(r => {
    S.list = page ? S.list.concat(r.items) : r.items; S.total = r.total;
    if (r.sum) {
      const t = [['Cao', 0], ['Trung bình', 1], ['Thấp', 2], ['none', 3]];
      $('#rsum').innerHTML = t.map(([k, i]) => { const b = r.sum[k]; return '<div class="rt rt' + i + (S.q.rating === k ? ' on' : '') + '" onclick="pickRt(\'' + k + '\')"><b>' + b.n + '</b><span>' + (k === 'none' ? 'Chưa đánh giá' : k) + '</span>' + (b.due ? '<em>' + b.due + ' cần gọi</em>' : '<em>&nbsp;</em>') + '</div>'; }).join('');
    }
    $('#cnt').textContent = r.total + ' khách' + (S.q.rating ? ' (' + (S.q.rating === 'none' ? 'chưa đánh giá' : 'tiềm năng ' + S.q.rating) + ', bấm lại ô màu để bỏ lọc)' : '') + '. Cao lên đầu, trong mỗi nhóm liên hệ gần nhất ở trên';
    $('#list').innerHTML = S.list.length ? S.list.map(card).join('') : '<div class="empty">Không có khách phù hợp</div>';
    $('#more').classList.toggle('hide', S.list.length >= r.total);
  }).catch(() => {});
}

function loadAllHist() {

function histHtml(list) {
  return (list.length ? list.map(x => '<div class="it"><div class="row"><b class="grow">' + esc(x.d) + ' · ' + esc(x.form) + '</b>' +
      (x.status ? '<span class="badge ' + stCls(x.status) + '">' + esc(x.status) + '</span>' : '') + '</div>' +
      '<div class="sub">' + esc(x.by) + (x.model ? ' · ' + esc(x.model) : '') + (x.appt ? ' · hẹn ' + esc(x.appt) : '') + (x.lost ? ' · ' + esc(x.lost) : '') + '</div>' +

function fileLink(f) {
  if (!f) return '';
  let url = f; try { const o = JSON.parse(f); url = o.url || ''; } catch (e) { }
  return /^https:\/\/drive\.google\.com\//.test(url) ? '<a href="' + esc(url) + '" target="_blank" class="sub">Xem tệp đính kèm</a>' : '';
}

function formContact() {
  const c = S.cur, cfg = S.cfg;
  const st0 = c.status === 'Chưa phân loại' || c.status === 'Mới' ? 'Đang chăm sóc' : c.status;
  openSheet('<div class="row"><b class="grow" style="font-size:17px">Cập nhật: ' + esc(c.name) + '</b><button class="btn sm ghost" onclick="closeSheet()">Đóng</button></div>' +
    '<label>Hình thức</label>' + chips('form', cfg.forms, 'Gọi điện') +
    '<label>Trạng thái</label>' + chips('status', ['Đang chăm sóc', 'Đã chốt', 'Mất'], st0) +
    '<div id="rtBox" class="' + (st0 === 'Đang chăm sóc' ? '' : 'hide') + '"><label>Mức tiềm năng *</label>' + chips('rating', RT, c.rating) +
    '<div class="sub" style="margin:-4px 0 8px">Cao: sắp mua, gọi 3 ngày/lần · Trung bình: 7 ngày/lần · Thấp: 30 ngày/lần</div></div>' +
    '<div id="lostBox" class="' + (st0 === 'Mất' ? '' : 'hide') + '"><label>Lý do mất</label>' + chips('lost', cfg.lost, '') + '</div>' +
    '<label>Ghi chú</label><textarea id="fn" placeholder="Khách nói gì, cần gì..."></textarea>' +
    '<div id="apptBox" class="' + (st0 === 'Đang chăm sóc' ? '' : 'hide') + '"><label>Hẹn gọi lại</label>' +
    chips('quick', ['Ngày mai', '3 ngày', '1 tuần', '2 tuần', '1 tháng'], '') +
    '<input id="fa" type="date" min="' + iso(new Date()) + '" value="' + esc(c.overdue ? '' : c.apptIso) + '"></div>' +
    '<label>Model quan tâm</label>' + modelSelect('fm', c.model) + photoInput('fph') +
    '<button class="btn" id="fsave">Lưu</button>');
  const box = $('#sheetBox');
  box.addEventListener('pick', e => {
    const { name, val } = e.detail;
    if (name === 'status') { $('#lostBox').classList.toggle('hide', val !== 'Mất'); $('#apptBox').classList.toggle('hide', val !== 'Đang chăm sóc'); $('#rtBox').classList.toggle('hide', val !== 'Đang chăm sóc'); }
    if (name === 'quick') $('#fa').value = addDays({ 'Ngày mai': 1, '3 ngày': 3, '1 tuần': 7, '2 tuần': 14, '1 tháng': 30 }[val]);
  });
  $('#fsave').onclick = () => {
    const p = { phone: c.phone, form: chipVal(box, 'form'), status: chipVal(box, 'status'), lost: chipVal(box, 'lost'), note: $('#fn').value, appt: $('#fa').value, model: $('#fm').value, rating: chipVal(box, 'rating') };
    if (p.status === 'Mất' && !p.lost) return toast('Chọn lý do mất khách', true);
    if (p.status === 'Đang chăm sóc' && !p.rating) return toast('Chọn mức tiềm năng: Cao, Trung bình hoặc Thấp', true);
    if (p.status === 'Đã chốt' && (!p.model || p.model === 'Chưa xác định')) return toast('Khách đã chốt: chọn model khách mua', true);
    if (p.status === 'Đang chăm sóc' && !p.appt && !confirm('Chưa đặt ngày hẹn gọi lại. Vẫn lưu?')) return;
    $('#fsave').disabled = true;
    const ph = $('#fph').files[0];
    api('saveContact', S.token, p).then(() => { closeSheet(); toast('Đã lưu'); return uploadPhoto(c.phone, ph).catch(() => {}); }).then(() => openCust(c.phone)).catch(() => { $('#fsave').disabled = false; });
  };
}

  if (isMgr()) {
    $('#tMine').onclick = () => { $('#tMine').classList.add('on'); $('#tAll').classList.remove('on'); load(true); };
    $('#tAll').onclick = () => { $('#tAll').classList.add('on'); $('#tMine').classList.remove('on'); load(false); };
    $('#tsave').onclick = () => {
      const p = { phone: $('#tp').value, name: $('#tn').value, to: $('#tto').value, deadline: $('#td').value, model: $('#tm').value, note: $('#tnote').value };
      $('#tsave').disabled = true;
      api('createTask', S.token, p).then(r => { toast(r && r.created ? 'Đã giao nhiệm vụ và tạo khách mới' : 'Đã giao nhiệm vụ'); vTask(); }).catch(() => { $('#tsave').disabled = false; });
    };
  }
  load(true);
}
function doneTask(id) {
  const note = prompt('Kết quả (có thể bỏ trống):', '');
  if (note === null) return;
  api('completeTask', S.token, id, note).then(() => { toast('Đã đánh dấu xong'); go(S.view); }).catch(() => {});
}

/* ---------- Xuất danh sách PDF ---------- */
function vExport() {
  const E = S.ex = S.ex || { kind: 'care', tinh: '', huyen: '', xa: '', owner: '', rating: '', model: '' };
  app.innerHTML = header('Xuất danh sách PDF', 'vCust()') + '<main><div class="card">' +
    '<div class="sub" style="margin-bottom:8px">Lọc khách ' + (isMgr() ? 'của đại lý' : 'của anh/chị') + ' theo địa bàn để in danh sách đi chăm sóc, mời dự sự kiện, trình diễn máy.</div>' +
    '<label>Loại danh sách</label><select id="exK"></select>' +
    '<label>Mức tiềm năng</label><select id="exR"><option value="">Tất cả mức</option>' + RT.concat(['none']).map(r => '<option value="' + r + '"' + (r === E.rating ? ' selected' : '') + '>' + (r === 'none' ? 'Chưa đánh giá' : r) + '</option>').join('') + '</select>' +
    '<label>Model</label><select id="exM"><option value="">Tất cả model</option>' + (S.cfg.models || []).map(m => '<option' + (m === E.model ? ' selected' : '') + '>' + esc(m) + '</option>').join('') + '</select>' +
    (isMgr() ? '<label>Nhân viên phụ trách</label><select id="exO"><option value="">Toàn đại lý</option>' + S.cfg.staff.map(x => '<option' + (x === E.owner ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '</select>' : '') +
    '<label>Tỉnh</label><select id="exT"></select><label>Huyện</label><select id="exH"></select><label>Xã, thôn</label><select id="exX"></select>' +
    '<div id="exN" class="sub" style="margin:4px 0 10px">&nbsp;</div>' +
    '<button class="btn" id="exGo">Tạo file PDF</button><div id="exR" style="margin-top:10px"></div></div></main>';
  const opts = (sel, arr, cur, all) => { $(sel).innerHTML = '<option value="">' + all + '</option>' + arr.map(x => '<option' + (x === cur ? ' selected' : '') + '>' + esc(x) + '</option>').join(''); };
  let tree = {}, ct;
  const count = () => { $('#exN').textContent = 'Đang đếm…'; clearTimeout(ct); ct = setTimeout(() => api('exportCount', S.token, E).then(n => { $('#exN').innerHTML = 'Có <b>' + n + '</b> khách khớp điều kiện'; }).catch(() => {}), 300); };
  const fill = () => {
    const ts = Object.keys(tree); if (E.tinh && ts.indexOf(E.tinh) < 0) E.tinh = '';
    opts('#exT', ts, E.tinh, 'Tất cả tỉnh');
    const hs = E.tinh ? Object.keys(tree[E.tinh]) : []; if (E.huyen && hs.indexOf(E.huyen) < 0) E.huyen = '';
    opts('#exH', hs, E.huyen, E.tinh ? 'Tất cả huyện' : '– Chọn tỉnh trước –');
    const xs = E.huyen ? tree[E.tinh][E.huyen] : []; if (E.xa && xs.indexOf(E.xa) < 0) E.xa = '';
    opts('#exX', xs, E.xa, E.huyen ? 'Tất cả xã' : '– Chọn huyện trước –');
    count();
  };
  const load = () => api('exportOptions', S.token, { owner: E.owner }).then(r => {
    tree = r.tree;
    $('#exK').innerHTML = Object.keys(r.kinds).map(k => '<option value="' + k + '"' + (k === E.kind ? ' selected' : '') + '>' + esc(r.kinds[k]) + '</option>').join('');
    fill();
  }).catch(() => {});
  $('#exK').onchange = e => { E.kind = e.target.value; count(); };
  $('#exR').onchange = e => { E.rating = e.target.value; count(); };
  $('#exM').onchange = e => { E.model = e.target.value; count(); };
  $('#exT').onchange = e => { E.tinh = e.target.value; E.huyen = ''; E.xa = ''; fill(); };
  $('#exH').onchange = e => { E.huyen = e.target.value; E.xa = ''; fill(); };
  $('#exX').onchange = e => { E.xa = e.target.value; count(); };
  if ($('#exO')) $('#exO').onchange = e => { E.owner = e.target.value; load(); };
  $('#exGo').onclick = () => api('exportPdf', S.token, E).then(r => {
    const bin = atob(r.b64), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([u8], { type: 'application/pdf' }));
    $('#exR').innerHTML = '<div class="sub" style="margin-bottom:6px">Đã tạo file ' + r.n + ' khách.</div>' +
      '<a class="btn ghost" style="display:block;text-align:center;text-decoration:none" href="' + url + '" download="' + esc(r.name) + '" target="_blank">Mở / tải file PDF</a>';
    try { $('#exR a').click(); } catch (e) {}
  }).catch(() => {});
  load();
}

/* ---------- Báo cáo ---------- */
function vReport() {
  const m = S.rm || iso(new Date()).slice(0, 7);
  app.innerHTML = header('Báo cáo') + '<main><input id="rm" type="month" value="' + m + '"><div id="rb"></div></main>';
  let rt; $('#rm').onchange = () => { clearTimeout(rt); rt = setTimeout(() => { if ($('#rm').value) { S.rm = $('#rm').value; vReport(); } }, 900); };
  api('getReport', S.token, m).then(r => {
    const bars = arr => { const mx = Math.max(1, ...arr.map(x => x[1])); return arr.length ? arr.map(x => '<div class="bar"><span class="l">' + esc(x[0]) + '</span><span class="grow"><i style="width:' + Math.round(100 * x[1] / mx) + '%"></i></span><span class="v">' + x[1] + '</span></div>').join('') : '<div class="sub">Chưa có số liệu</div>'; };
    const pm = 'T' + (+r.prevMonth.slice(5)) + '/' + r.prevMonth.slice(0, 4);
    $('#rb').innerHTML = '<div class="sub">Phạm vi: ' + esc(r.scope) + ' · so sánh với tháng trước (' + pm + ')</div>' +
      (r.me ? meHtml(r.me) : '') +
      '<h2>' + (r.me ? 'Khách hàng của tôi' : 'Toàn đại lý') + '</h2><div class="stats">' +
        kpi('Tổng khách đang có', r.now.total, r.prev.total) + kpi('Khách mới', r.now.newLeads, r.prev.newLeads) + kpi('Khách chăm sóc', r.now.caring, r.prev.caring) +
        kpi('Đã chốt', r.now.won, r.prev.won) + kpi('Mất', r.now.lost, r.prev.lost, true) + kpi('Lần tương tác', r.now.contacts, r.prev.contacts) +
      '</div><div class="sub" style="margin-top:6px">Tỷ lệ chốt tháng này: <b>' + (r.winRate == null ? '–' : r.winRate + '%') + '</b> · Khách được liên hệ: <b>' + r.customers + '</b></div>' +
      (r.board ? boardHtml(r.board) : '') +
      '<h2>Khách mới theo nguồn</h2><div class="card">' + bars(r.bySource) + '</div>' +
      '<h2>Lý do mất khách</h2><div class="card">' + bars(r.byLost) + '</div>' +
      '<h2>Trạng thái khách hiện tại</h2><div class="card">' + bars(r.byStatus) + '</div>' +
      (isMgr() ? transferHtml() : '');
  }).catch(() => {});
}

/* ---------- Chuyển khách khi nhân viên nghỉ (chủ đại lý, Admin) ---------- */
function transferHtml() {
  const opt = S.cfg.staff.map(s => '<option>' + esc(s) + '</option>').join('');
  return '<h2>Chuyển khách khi nhân viên nghỉ</h2><div class="card">' +
    '<div class="sub" style="margin-bottom:8px">Chuyển toàn bộ khách và nhiệm vụ chưa xong của một người sang người khác. Lịch sử liên hệ vẫn giữ tên người đã làm.</div>' +
    '<label>Chuyển khách của</label><select id="tfFrom"><option value="">– Chọn –</option>' + opt + '<option value="__other">Người đã nghỉ (gõ tên)…</option></select>' +
    '<input id="tfOther" placeholder="Tên đúng như trong STAFF" style="display:none">' +
    '<label>Sang người</label><select id="tfTo"><option value="">– Chọn –</option>' + opt + '</select>' +
    '<button class="btn" onclick="doTransfer()">Chuyển khách</button></div>';
}
document.addEventListener('change', e => { if (e.target.id === 'tfFrom') $('#tfOther').style.display = e.target.value === '__other' ? 'block' : 'none'; });
function doTransfer() {
  const f = $('#tfFrom').value === '__other' ? $('#tfOther').value.trim() : $('#tfFrom').value, t = $('#tfTo').value;
  if (!f || !t) return toast('Chọn người chuyển và người nhận', true);
  if (!confirm('Chuyển toàn bộ khách của ' + f + ' sang ' + t + '?')) return;
  api('transferCustomers', S.token, f, t).then(n => { toast('Đã chuyển ' + n.kh + ' khách, ' + n.task + ' nhiệm vụ'); vReport(); }).catch(() => {});
}

/* ---------- Kết quả cá nhân ---------- */
function kpi(label, v, p, lowerIsBetter) {
  const d = v - p;
  const good = lowerIsBetter ? d < 0 : d > 0, bad = lowerIsBetter ? d > 0 : d < 0;
  const col = good ? 'var(--ok)' : bad ? 'var(--bad)' : 'var(--sub)';
  const txt = d === 0 ? '= tháng trước' : (d > 0 ? '▲ +' : '▼ ') + d + ' so với tháng trước';
  return '<div class="stat"><b>' + v + '</b><span>' + label + '</span><div style="font-size:11px;font-weight:600;color:' + col + ';margin-top:2px">' + txt + '</div></div>';
}
function meHtml(me) {
  const names = { won: 'Khách đã chốt', newLeads: 'Khách mới', contacts: 'Lần liên hệ', newCare: 'Chăm khách mới', winRate: 'Tỷ lệ chốt', onTime: 'Gọi đúng hẹn' };
  const ds = me.prevScore == null ? '' : (me.score - me.prevScore === 0 ? 'bằng tháng trước' : (me.score > me.prevScore ? '▲ +' : '▼ ') + (me.score - me.prevScore) + ' điểm so với tháng trước');
  return '<div class="card" style="margin-top:10px"><div class="rk"><div class="no r' + me.rank + '">' + me.rank + '</div>' +
    '<div class="grow"><div class="name">Hạng ' + me.rank + '/' + me.of + ' trong đại lý</div><div class="sub">' + ds + (me.prevRank ? ' · tháng trước hạng ' + me.prevRank : '') + '</div></div>' +
    '<div class="sc">' + me.score + '<small>/100 điểm</small></div></div>' +
    '<div style="margin-top:10px">' + Object.keys(names).map(k => {
      const got = me.parts[k], max = me.weights[k];
      return '<div class="bar"><span class="l">' + names[k] + '</span><span class="grow"><i style="width:' + Math.round(100 * got / max) + '%"></i></span><span class="v" style="width:60px">' + Math.round(got) + '/' + max + '</span></div>';
    }).join('') + '</div>' +
    '<div class="sub" style="margin-top:6px">Thanh nào ngắn là chỗ cần cố thêm. Đang quá hẹn: <b>' + me.overdue + '</b> khách.</div></div>';
}

/* ---------- Bảng thi đua ---------- */
function pct(v) { return v == null ? '–' : v + '%'; }
function boardHtml(bd) {
  const w = bd.weights;
  const rows = bd.list.map(b => '<div class="card"><div class="rk"><div class="no r' + b.rank + '">' + b.rank + '</div>' +
    '<div class="grow"><div class="name">' + esc(b.name) + '</div><div class="sub">Phụ trách ' + b.total + ' khách · đang chăm sóc ' + b.caring + '</div></div>' +
    '<div class="sc">' + b.score + '<small>/100 điểm</small></div></div>' +
    '<div class="sbar"><i style="width:' + b.score + '%"></i></div>' +
    '<div class="mx">' +
      '<div><b>' + b.won + '</b><span>Đã chốt</span></div><div><b>' + b.lost + '</b><span>Mất</span></div><div><b>' + pct(b.winRate) + '</b><span>Tỷ lệ chốt</span></div>' +
      '<div><b>' + b.newLeads + '</b><span>Khách mới</span></div><div><b>' + pct(b.newCareRate) + '</b><span>Chăm khách mới</span></div><div><b>' + b.contacts + '</b><span>Lần liên hệ</span></div>' +
      '<div><b>' + b.customers + '</b><span>Khách được LH</span></div><div><b>' + b.overdue + '</b><span>Quá hẹn</span></div><div><b>' + pct(b.onTimeRate) + '</b><span>Đúng hẹn</span></div>' +
    '</div></div>').join('');
  return '<h2>Bảng thi đua nhân viên</h2>' + (bd.list.length ? rows : '<div class="empty">Chưa có nhân viên</div>') +
    '<details class="card"><summary><b>Cách tính điểm (100 điểm)</b></summary><div style="margin-top:8px">' +
    '<table><tr><th>Tiêu chí</th><th>Điểm</th></tr>' +
    '<tr><td>Số khách đã chốt (so với người cao nhất)</td><td>' + w.won + '</td></tr>' +
    '<tr><td>Số khách mới (so với người cao nhất)</td><td>' + w.newLeads + '</td></tr>' +
    '<tr><td>Số lần liên hệ, tối đa ' + bd.cap + ' lần/ngày (so với người cao nhất)</td><td>' + w.contacts + '</td></tr>' +
    '<tr><td>Tỷ lệ chăm khách mới (khách mới đã được cập nhật lại)</td><td>' + w.newCare + '</td></tr>' +
    '<tr><td>Tỷ lệ chốt = Chốt / (Chốt + Mất)</td><td>' + w.winRate + '</td></tr>' +
    '<tr><td>Tỷ lệ đúng hẹn (khách có hẹn mà chưa quá hẹn)</td><td>' + w.onTime + '</td></tr></table>' +
    '<div class="sub" style="margin-top:8px">Chỉ xếp hạng tài khoản vai trò Nhân viên. Số liệu theo tháng đang chọn, riêng Phụ trách, Đang chăm sóc, Quá hẹn, Đúng hẹn là số hiện tại.</div></div></details>';
}

/* Chân trang hotline + bản quyền ở cuối mỗi trang */
new MutationObserver(() => { const m = app.querySelector('main'); if (!m) return; const c = m.querySelector(':scope > .credit'); if (!c) m.insertAdjacentHTML('beforeend', CREDIT); else if (c !== m.lastElementChild) m.appendChild(c); })
  .observe(app, { childList: true, subtree: true });

/* ---------- Cài app lên màn hình chính ---------- */
let deferredPrompt = null;
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; showInstall(); });
function installHtml() {
  if (isStandalone()) return '';
  if (/Zalo|FBAN|FBAV|FB_IAB|Messenger|Instagram|Line\//i.test(navigator.userAgent)) return '<div class="install" style="border-color:var(--red)"><b>Đang mở trong ' + (/Zalo/i.test(navigator.userAgent) ? 'Zalo' : 'Facebook') + '.</b> Để cài app và dùng ổn định: bấm <b>⋯</b> (hoặc <b>⋮</b>) ở góc trên, chọn <b>Mở bằng trình duyệt</b> (' + (isIOS() ? 'Safari' : 'Chrome') + ').</div>';
  if (isIOS()) return '<div class="install"><b>Cài app lên iPhone:</b> bấm nút <b>Chia sẻ</b> (ô vuông có mũi tên lên) ở thanh dưới Safari, chọn <b>Thêm vào MH chính</b>, rồi bấm <b>Thêm</b>.</div>';
  if (deferredPrompt) return '<div class="install"><b>Cài app lên điện thoại</b> để mở nhanh như ứng dụng thật.<button class="btn" style="margin-top:8px" onclick="doInstall()">Cài đặt Yanmar CRM</button></div>';
  return '<div class="install"><b>Cài app lên Android:</b> bấm <b>⋮</b> góc trên Chrome, chọn <b>Cài đặt ứng dụng</b> hoặc <b>Thêm vào màn hình chính</b>.</div>';
}
function showInstall() { const el = document.getElementById('installBox'); if (el) el.innerHTML = installHtml(); }
function doInstall() { if (!deferredPrompt) return; deferredPrompt.prompt(); deferredPrompt.userChoice.finally(() => { deferredPrompt = null; showInstall(); }); }
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

function dealerPick() {
  const all = window.CRM_DEALERS || {}, ids = Object.keys(all), cur = crmDealerId();
  if (ids.length <= 1) return cur ? '<p class="dl">Đại lý: <b>' + esc(all[cur].name) + '</b></p>' : '';
  return '<label>Đại lý của bạn</label><select id="dlSel" onchange="pickDealer(this.value)"><option value="">– Chọn đại lý –</option>' +
    ids.map(i => '<option value="' + i + '"' + (i === cur ? ' selected' : '') + '>' + esc(all[i].name) + '</option>').join('') + '</select>';
}
function pickDealer(v) { try { localStorage.setItem('crm_dl', v); localStorage.removeItem('crm_tk'); } catch (e) {} }
/* ---------- Khởi động ---------- */
(function init() {
  const tk = store('crm_tk');
  if (!tk) return showLogin();
  S.token = tk;
  google.script.run.withSuccessHandler(r => { S.user = r.user; S.cfg = r.cfg; start(); })
    .withFailureHandler(() => { store('crm_tk', null); showLogin(); }).me(tk);
})();
</script>
